<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hex Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Hex Search</h1>
    <form id="searchForm" autocomplete="off">
      <input id="query" name="q" type="search" placeholder="Search the web..." aria-label="Search the web" required>
      <button type="submit">Search</button>
    </form>
    <button id="historyButton" class="history" type="button">Use History Once</button>
    <p id="status" aria-live="polite"></p>
    <div id="history" hidden></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
